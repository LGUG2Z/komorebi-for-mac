[package]
name = "komorebi-recorder"
version = "0.1.1"
description = "Synchronized screen, log and trace capture for komorebi bug reproduction"
edition = "2024"

[dependencies]
komorebi-client = { path = "../komorebi-client", default-features = false }

block2 = "0.6"
chrono = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
crossbeam-channel = { workspace = true }
ctrlc = { version = "3", features = ["termination"] }
dispatch2 = "0.3"
eframe = { workspace = true }
libc = "0.2"
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-media",
  "AVAsset",
  "AVAssetWriter",
  "AVAssetWriterInput",
  "AVMediaFormat",
  "AVVideoSettings",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFArray",
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFCGTypes",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "CGDirectDisplay",
  "CGDisplayConfiguration",
  "CGError",
  "CGGeometry",
  "CGRemoteOperation",
  "CGSession",
  "CGWindow",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-video",
  "CMBase",
  "CMSampleBuffer",
  "CMSync",
  "CMTime",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSError",
  "NSObject",
  "NSString",
  "NSURL",
  "NSValue",
] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "dispatch2",
  "libc",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-core-media",
  "SCShareableContent",
  "SCStream",
] }
parking_lot = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }

[build-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
